<!DOCTYPE html>
<html lang="en">
<head>
	<!--This is the complaints and delivery enquiries page for Bambi Beauty-->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Complaints & Delivery Enquiries | Bambi Beauty</title>
	<link rel="stylesheet" href="style.html">
</head>
<body>
	<main class="container">
		<h1>How can we help?</h1>
		<p class="intro">Use the form below to submit a complaint or enquire about your delivery. Our team will get back to you as soon as possible.</p>

		<form action="#" method="post">
			<div>
				<label for="name">Full name <span class="required">*</span></label>
				<input type="text" id="name" name="name" required autocomplete="name">
			</div>
			<div>
				<label for="email">Email address <span class="required">*</span></label>
				<input type="email" id="email" name="email" required autocomplete="email">
			</div>
			<div>
				<label for="order-number">Order number</label>
				<input type="text" id="order-number" name="order-number" placeholder="e.g. BB12345">
			</div>
			<div>
				<label for="enquiry-type">What would you like help with? <span class="required">*</span></label>
				<select id="enquiry-type" name="enquiry-type" required>
					<option value="" selected disabled>Select an option</option>
					<option value="delivery">Delivery enquiry</option>
					<option value="complaint">Complaint</option>
					<option value="other">Other enquiry</option>
				</select>
			</div>
			<div>
				<label for="message">Message <span class="required">*</span></label>
				<textarea id="message" name="message" required placeholder="Please provide details about your complaint or delivery enquiry."></textarea>
			</div>
			<button type="submit">Send enquiry</button>
		</form>
	</main>
</body>
</html>
